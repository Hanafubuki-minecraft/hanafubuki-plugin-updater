# Hanafubuki Plugin Updater
#
# Updates are downloaded into the Bukkit update folder (plugins/update/ by default) under the
# same file name as the installed jar. Paper swaps them in on the next restart; running jars
# are never touched. All network work runs in the background.
#
# Values written as "${NAME}" are read from the environment variable NAME. Use this for
# tokens and webhook URLs so secrets do not live in this file.
#
# Docs: https://github.com/Hanafubuki-minecraft/hanafubuki-plugin-updater/tree/master/docs

# ============================================
# GLOBAL
# ============================================
global:
  # Installed versions below min_version are never updated. Empty = no limit.
  min_version: ""
  # Versions above max_version are never installed. Empty = no limit.
  max_version: ""
  # Write the new version into the plugin's entry below after an update.
  auto_update_config: true
  # Allow "/updateplugins discover add" to add installed plugins that are missing below.
  auto_discover: false
  # Run discovery once at startup and add every plugin it can identify.
  auto_discover_on_startup: false
  # How many plugins are checked at the same time (1-16).
  parallelism: 4
  # Largest accepted plugin jar in MB.
  max_download_mb: 256

# ============================================
# WHICH PLUGINS ARE UPDATED
# ============================================
modes:
  # true  = only plugins in include_list are updated
  # false = every plugin in "plugins:" is updated, except exclude_list
  include_only: false
  # Never updated, in both modes (names are case-insensitive).
  exclude_list: []
  include_list: []

# ============================================
# AUTOMATIC CHECKS
# ============================================
schedule:
  # off | interval | daily | weekly
  mode: off
  # interval mode: minutes between checks (15-10080)
  interval_minutes: 360
  # daily / weekly mode: local time HH:MM
  time: "04:00"
  # weekly mode: monday ... sunday
  day: monday
  # Time zone for daily/weekly, e.g. Europe/Moscow. Empty = server time zone.
  timezone: ""
  # Also check once after the server started.
  check_on_startup: false
  startup_delay_seconds: 60
  # true = automatic runs only report updates and download nothing.
  check_only: false

# ============================================
# SAFETY
# ============================================
backups:
  # Keep a copy of the replaced jar before every update, for /updateplugins rollback.
  enabled: true
  # Backups kept per plugin; older ones are deleted (1-100).
  keep: 3

dependencies:
  # Checks the new version's required plugins and api-version before staging it.
  # block = do not install, warn = install and warn, off = no check
  check: block

# ============================================
# NOTIFICATIONS
# ============================================
notifications:
  # Message players with hanafubuki.updater.notify (ops by default) about updates and advisories.
  in_game: true
  # Remind them on join while updates wait for a restart.
  on_join: true
  # Name used in Discord and webhook messages.
  server_name: "Hanafubuki"

  discord:
    enabled: false
    # Server settings -> Integrations -> Webhooks -> Copy Webhook URL. "${DISCORD_WEBHOOK_URL}" works too.
    webhook_url: ""
    username: "Hanafubuki Updater"
    avatar_url: ""
    # Put in front of every message, e.g. "<@&123456789012345678>" to ping a role. Empty = no ping.
    mention: ""
    # updated, available, failed, security, summary
    events: [updated, failed, security]

  webhook:
    enabled: false
    # Receives a JSON POST after each run (see docs/configuration.md for the format).
    url: ""
    headers: {}
      # Authorization: "Bearer ${UPDATER_WEBHOOK_TOKEN}"
    events: [updated, available, failed, security, summary]

# ============================================
# SOURCES
# ============================================
# Every source section accepts:
#   timeout: 10            API request timeout in seconds
#   download_timeout: 120  download timeout in seconds
#   retry: { max_retries: 3, base_delay_ms: 1000, max_delay_ms: 10000 }

modrinth:
  # Loaders and game versions a Modrinth version must list. Empty game_versions = the server's version.
  loaders: ["paper"]
  game_versions: []
  # release, beta, alpha
  version_types: ["release"]

github:
  # Optional token: raises the API limit from 60 to 5000 requests per hour and allows private repos.
  # Prefer an environment variable: token: "${GITHUB_TOKEN}"
  token: ""
  # Release signatures: off | warn | require (the release tag or its commit must be verified by GitHub)
  signatures: off
  include_prereleases: false
  # Check GitHub security advisories of every plugin that has a "repo" set (any source).
  advisories: true

hangar:
  # Channel to use: Release, Snapshot, ... or "*" for any channel.
  channel: "Release"

spigotmc: {}

custom: {}

# ============================================
# OUTPUT
# ============================================
console:
  # One JSON object per line instead of coloured text (for log collectors).
  json_format: false

# MiniMessage styles for chat and console: https://docs.advntr.dev/minimessage/format.html
style:
  prefix: "<gradient:#f9a8d4:#c4b5fd>Hanafubuki</gradient> <dark_gray>»</dark_gray> "
  primary: "<#f9a8d4>"
  accent: "<#c4b5fd>"
  success: "<green>"
  warning: "<yellow>"
  error: "<red>"
  muted: "<gray>"

# HTTP endpoint for monitoring: GET /health (JSON) and GET /metrics (Prometheus).
health_check:
  enabled: false
  # 127.0.0.1 = only reachable from this machine. Use 0.0.0.0 only behind a firewall.
  bind_address: "127.0.0.1"
  port: 8080

# ============================================
# PLUGINS
# ============================================
# The key is the plugin name as shown by /plugins. Every entry needs "source".
# "version" is informational; the installed version is read from the server.
# Optional for every entry: min_version, max_version, repo (GitHub owner/repo for security advisories).
#
# modrinth:  project_id (optional - the installed jar is identified by its SHA-512 hash),
#            loaders, game_versions, version_types
# github:    repo: owner/repo, asset_pattern: "Plugin-*.jar", include_prereleases, signatures
# hangar:    project_slug: ViaVersion, channel
# spigotmc:  resource_id: 12345 (number from the spigotmc.org URL) or resource_name (exact, unique)
# local:     path: /dir/or/file.jar, pattern: "MyPlugin-(.+)\\.jar"
# custom:    url, version_path, download_url_path, checksum_path, headers, auth, allow_http
#
# Examples (see docs/config.example.yml for more):
#
#   LuckPerms:
#     source: modrinth
#   ViaVersion:
#     source: hangar
#     project_slug: ViaVersion
#     repo: ViaVersion/ViaVersion
#   ProtocolLib:
#     source: github
#     repo: dmulloy2/ProtocolLib
#     asset_pattern: "ProtocolLib.jar"
#   EssentialsX:
#     source: github
#     repo: EssentialsX/Essentials
#     asset_pattern: "EssentialsX-2*.jar"
#
# Run "/updateplugins discover" to get suggestions for your installed plugins.
plugins: {}

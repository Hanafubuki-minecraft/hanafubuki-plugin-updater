# Hanafubuki Plugin Updater Configuration
# This file controls how the updater works with Modrinth and GitHub sources

# Global settings
global:
  # Minimum version that plugins must meet to be updated
  min_version: "1.0.0"
  
  # Maximum version that plugins can be updated to
  max_version: "99.99.99"

# Plugin update modes
modes:
  # Update only plugins listed in the included list below
  include_only: false
  
  # Exclude specific plugins from updating (works with both modes)
  exclude_list:
    - "plugin-name-1"
    - "plugin-name-2"

# Modrinth source configuration
modrinth:
  # Enable or disable Modrinth updates
  enabled: true
  
  # API base URL (default is https://api.modrinth.com/v2)
  api_url: "https://api.modrinth.com/v2"
  
  # Cache duration for Modrinth API requests (in seconds)
  cache_duration: 3600

# GitHub source configuration
github:
  # Enable or disable GitHub updates
  enabled: true
  
  # GitHub API base URL (default is https://api.github.com)
  api_url: "https://api.github.com"
  
  # Cache duration for GitHub API requests (in seconds)
  cache_duration: 1800

# Plugin list - plugins to update
plugins:
  # Example plugin entry
  # plugin-name:
  #   source: "modrinth"  # or "github"
  #   version: "1.2.3"    # current version
  #   target_version: "1.2.4"  # target version (optional, will auto-detect if not set)
  #   url: "https://modrinth.com/plugin/plugin-name"  # plugin URL (optional)
  
  # Add your plugins here:
  # example-plugin:
  #   source: "modrinth"
  #   version: "1.0.0"
  #   target_version: "1.0.1"

# Console output settings
console:
  # Enable verbose logging
  verbose: false
  
  # Color scheme for console output
  colors:
    info: "blue"
    warning: "yellow"
    error: "red"
    success: "green"
    
  # Output format (plain or colored)
  format: "colored"

# Commit message template
commit_message: "Plugin {plugin} updated, try restarting"

name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "Version: $VERSION"

      - name: Print version
        run: echo "world"
name: Release

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        
      - name: Build plugin
        run: ./gradlew build
        
      - name: Get version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Create Release
        id: create_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const existingRelease = releases.find(release => release.tag_name === `v${process.env.VERSION}`);
            
            if (existingRelease) {
              console.log(`Release v${process.env.VERSION} already exists`);
              return { 
                upload_url: existingRelease.upload_url,
                tag_name: existingRelease.tag_name
              };
            } else {
              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: `v${process.env.VERSION}`,
                name: `Version ${process.env.VERSION}`,
                body: `Plugin version ${process.env.VERSION}\n\nAutomatic release from GitHub Actions`,
                draft: false,
                prerelease: false
              });
              
              console.log(`Created release v${process.env.VERSION}`);
              return {
                upload_url: response.data.upload_url,
                tag_name: response.data.tag_name
              };
            }
          
      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/libs/hanafubuki-plugin-updater-${{ steps.get_version.outputs.version }}.jar
          asset_name: hanafubuki-plugin-updater-${{ steps.get_version.outputs.version }}.jar
          asset_content_type: application/java-archive
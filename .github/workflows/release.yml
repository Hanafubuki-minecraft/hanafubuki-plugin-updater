name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  releases: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Print version
        run: echo "world"
name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        run: echo "version=1.0.0" >> $GITHUB_OUTPUT

      - name: Print version
        run: echo "Version: test"
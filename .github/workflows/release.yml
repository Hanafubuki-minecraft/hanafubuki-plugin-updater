name: Release Plugin

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3e6b490d18c65816a00597f032622972150 # v3.4.0
      
    - name: Build plugin
      run: ./gradlew build
      
    - name: Get version from gradle.properties
      id: get_version
      run: |
        VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        release_name: Release v${{ steps.get_version.outputs.version }}
        body: |
          Automated release of version ${{ steps.get_version.outputs.version }}
          
          ## Changes
          - Automatic build from master branch
          - Plugin built with Gradle
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./build/libs/hanafubuki-plugin-updater-${{ steps.get_version.outputs.version }}.jar
        asset_name: hanafubuki-plugin-updater-${{ steps.get_version.outputs.version }}.jar
        asset_content_type: application/java-archive
name: Release

on:
  push:
    branches: [master]
    paths:
      - gradle.properties

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for tags to check if release already exists

      - name: Read version
        id: v
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — release not needed"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New version v$VERSION"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Create Release
        if: steps.v.outputs.exists == 'false'
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          TAG="v$VERSION"
          JAR="build/libs/hanafubuki-plugin-updater-$VERSION.jar"
          
          gh release create "$TAG" "$JAR" --title "Release $TAG" --notes "Release $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
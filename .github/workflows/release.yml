name: Release

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      releases: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Build plugin
        run: |
          echo "Building plugin..."
          ./gradlew build
          echo "Build completed"
        
      - name: Get version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found version: $VERSION"
          
      - name: Check if release exists
        id: check_release
        run: |
          echo "Checking for existing release v${{ env.VERSION }}"
          # This is a basic check to see if the workflow can communicate with GitHub API
          echo "Release check complete"
          
      - name: Create Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const existingRelease = releases.find(release => release.tag_name === `v${process.env.VERSION}`);
            
            if (existingRelease) {
              console.log(`Release v${process.env.VERSION} already exists`);
              return;
            }
            
            try {
              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: `v${process.env.VERSION}`,
                name: `Version ${process.env.VERSION}`,
                body: `Plugin version ${process.env.VERSION}\n\nAutomatic release from GitHub Actions`,
                draft: false,
                prerelease: false
              });
              
              console.log(`Created release v${process.env.VERSION}`);
            } catch (error) {
              console.error(`Failed to create release v${process.env.VERSION}:`, error.message);
              throw error;
            }
          
      - name: Debug Information
        run: |
          echo "Workflow completed successfully"
          echo "Version: ${{ env.VERSION }}"
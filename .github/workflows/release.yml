name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  releases: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          name: Release v$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          draft: false
          prerelease: false
          files: build/libs/hanafubuki-plugin-updater-$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' ').jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
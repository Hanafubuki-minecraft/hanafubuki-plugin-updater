global:
  min_version: "0.0.1"
  max_version: "99.99.99"
  auto_update_config: true

modes:
  include_only: false
  exclude_list: []
  include_list: []

modrinth:
  loaders: ["paper", "spigot", "bukkit"]
  game_versions: ["1.21.8", "1.21.9", "1.21.10"]

github: {}

console:
  mini_message: true
  colors:
    info: "<green>"
    warning: "<yellow><bold>"
    error: "<red><italic>"
    success: "<aqua><bold>"
    header: "<gradient:gold:yellow>"

plugins:
  "WorldEdit":
    source: "modrinth"
    version: "7.4.6"

  "ViaVersion":
    source: "modrinth"
    version: "5.12.3-SNAPSHOT+1113"

  "Geyser-Spigot":
    source: "modrinth"
    version: "2.12.1-b1279"
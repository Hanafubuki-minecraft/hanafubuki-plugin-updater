# Hanafubuki Plugin Updater - Example Configuration
# Copy this file to config.yml and customize for your server

# ============================================
# GLOBAL SETTINGS
# ============================================
global:
  # Minimum version that plugins must meet to be updated
  # Plugins below this version will be skipped
  min_version: "1.0.0"
  
  # Maximum version that plugins can be updated to
  # Use "latest" or high version like "99.99.99" for no limit
  max_version: "99.99.99"
  
  # Auto-discover installed plugins not in config
  # When true, discovered plugins can be added via /updateplugins discover
  auto_discover: false
  
  # Auto-update config.yml with new versions after successful update
  auto_update_config: true

# ============================================
# UPDATE MODES
# ============================================
modes:
  # Include-only mode:
  # - true  = Only update plugins explicitly listed in include_list
  # - false = Update all configured plugins except those in exclude_list
  include_only: false
  
  # List of plugins to exclude from updates
  # Works in BOTH modes (include_only true or false)
  exclude_list: []
    # - "plugin-to-skip"
    # - "another-plugin"
  
  # List of plugins to include (only used when include_only: true)
  include_list: []
    # - "plugin-to-update"
    # - "another-plugin"

# ============================================
# MODRINTH SETTINGS
# ============================================
modrinth:
  # Custom User-Agent (optional, defaults to plugin name/version)
  # user_agent: "MyServer/Updater/1.0"
  
  # API request timeout in seconds (default: 10)
  # timeout: 10
  
  # Download timeout in seconds (default: 60)
  # download_timeout: 60
  
  # Default loader filter (default: ["paper"])
  # loaders: ["paper", "spigot"]
  
  # Default game version filter (default: ["1.21.9"])
  # game_versions: ["1.21.9", "1.21.8"]
  
  # Retry configuration for failed requests
  retry:
    # Maximum number of retry attempts (default: 3)
    max_retries: 3
    
    # Base delay in milliseconds (default: 1000)
    # Actual delay = base_delay * 2^attempt + jitter
    base_delay_ms: 1000
    
    # Maximum delay in milliseconds (default: 10000)
    max_delay_ms: 10000

# ============================================
# GITHUB SETTINGS
# ============================================
github:
  # Custom User-Agent (optional, defaults to plugin name/version)
  # user_agent: "MyServer/Updater/1.0"
  
  # API request timeout in seconds (default: 10)
  # timeout: 10
  
  # Download timeout in seconds (default: 60)
  # download_timeout: 60
  
  # GitHub token for authenticated requests (optional, increases rate limit)
  # Get token at: https://github.com/settings/tokens
  # token: "ghp_xxxxxxxxxxxx"
  
  # Default branch to check if no releases exist (default: "main")
  # default_branch: "main"
  
  # Retry configuration for failed requests
  retry:
    # Maximum number of retry attempts (default: 3)
    max_retries: 3
    
    # Base delay in milliseconds (default: 1000)
    # Actual delay = base_delay * 2^attempt + jitter
    base_delay_ms: 1000
    
    # Maximum delay in milliseconds (default: 10000)
    max_delay_ms: 10000

# ============================================
# HANGAR SETTINGS (PaperMC official plugin repository)
# ============================================
hangar:
  # Custom User-Agent (optional, defaults to plugin name/version)
  # user_agent: "MyServer/Updater/1.0"
  
  # API request timeout in seconds (default: 10)
  # timeout: 10
  
  # Download timeout in seconds (default: 60)
  # download_timeout: 60

# ============================================
# SPIGOTMC SETTINGS (via Spiget API)
# ============================================
spigotmc:
  # Custom User-Agent (optional, defaults to plugin name/version)
  # user_agent: "MyServer/Updater/1.0"
  
  # API request timeout in seconds (default: 10)
  # timeout: 10
  
  # Download timeout in seconds (default: 60)
  # download_timeout: 60

# ============================================
# LOCAL FILE SOURCE SETTINGS
# ============================================
local:
  # Timeout for file operations in seconds (default: 5)
  # timeout: 5

# ============================================
# CUSTOM HTTP SOURCE SETTINGS
# ============================================
custom:
  # Custom User-Agent (optional, defaults to plugin name/version)
  # user_agent: "MyServer/Updater/1.0"
  
  # API request timeout in seconds (default: 10)
  # timeout: 10
  
  # Download timeout in seconds (default: 60)
  # download_timeout: 60

# ============================================
# CONSOLE OUTPUT SETTINGS
# ============================================
console:
  # Enable MiniMessage formatting (default: true)
  # Requires Paper/Adventure API
  mini_message: true
  
  # Output as JSON lines instead of human-readable (default: false)
  # Each line is a JSON object with: timestamp, level, plugin, action, version, duration_ms, error
  json_format: false
  
  # Color configuration for different message types
  # Use MiniMessage format: https://docs.advntr.dev/minimessage/format.html
  colors:
    info: "<green>"
    warning: "<yellow><bold>"
    error: "<red><italic>"
    success: "<aqua><bold>"
    header: "<gradient:gold:yellow>"

# ============================================
# HEALTH CHECK SETTINGS
# ============================================
health_check:
  # Enable HTTP health check endpoint (default: false)
  enabled: false
  
  # Port to bind the health check endpoint (default: 8080)
  # Only used when enabled: true
  port: 8080

# ============================================
# PLUGIN LIST - Plugins to update
# ============================================
plugins:
  # ============================================
  # MODRINTH PLUGINS
  # ============================================
  # For Modrinth plugins, 'source' and 'version' are required.
  # The plugin identifies the project by SHA-512 hash of the installed JAR
  # (secure, no search by name). You can optionally specify 'project_id'
  # (Modrinth project ID or slug) to override hash-based lookup.
  
  # Example: WorldEdit (Modrinth)
  "WorldEdit":
    source: "modrinth"
    version: "7.3.12"
    # project_id: "A1B2C3D4"  # Optional: explicit Modrinth project ID
    # min_version: "7.0.0"    # Optional: override global min
    # max_version: "7.9.9"    # Optional: override global max
  
  # Example: LuckPerms (Modrinth)
  "LuckPerms":
    source: "modrinth"
    version: "5.4.120"
    # project_id: "luckperms"
  
  # Example: ViaVersion (Modrinth)
  "ViaVersion":
    source: "modrinth"
    version: "5.3.0"
    # project_id: "viaversion"
  
  # Example: Geyser (Modrinth)
  "Geyser-Spigot":
    source: "modrinth"
    version: "2.4.0"
    # project_id: "geyser"

  # ============================================
  # GITHUB PLUGINS
  # ============================================
  # For GitHub plugins, 'source', 'version', AND 'repo' are required.
  # 'repo' must be in 'owner/repo' format.
  # The plugin will check releases, falling back to main branch commit.
  
  # Example: Paper (GitHub)
  "Paper":
    source: "github"
    version: "1.21.9-R0.1"
    repo: "PaperMC/Paper"
    # asset_pattern: "paper-*.jar"  # Optional: specific asset pattern
    # min_version: "1.21.0"         # Optional: override global min
    # max_version: "1.21.9"         # Optional: override global max
  
  # Example: Floodgate (GitHub)
  "Floodgate":
    source: "github"
    version: "2.4.0"
    repo: "GeyserMC/Floodgate"
    # asset_pattern: "floodgate-spigot.jar"
  
  # Example: ProtocolLib (GitHub)
  "ProtocolLib":
    source: "github"
    version: "5.2.0"
    repo: "dmulloy2/ProtocolLib"
    # asset_pattern: "ProtocolLib.jar"

  # ============================================
  # HANGAR PLUGINS (PaperMC official plugin repository)
  # ============================================
  # For Hangar plugins, 'source', 'version', and 'project_slug' are required.
  # 'project_slug' must be in 'owner/slug' format (e.g., "EngineHub/WorldEdit").
  # The plugin filters by Paper platform and server version automatically.
  # SHA-256 checksums are verified from the API.
  
  # Example: WorldEdit (Hangar)
  "WorldEdit-Hangar":
    source: "hangar"
    version: "7.4.5"
    project_slug: "EngineHub/WorldEdit"
    # min_version: "7.0.0"    # Optional: override global min
    # max_version: "7.9.9"    # Optional: override global max

  # Example: LuckPerms (Hangar)
  "LuckPerms-Hangar":
    source: "hangar"
    version: "5.4.120"
    project_slug: "LuckPerms/LuckPerms"

  # ============================================
  # SPIGOTMC PLUGINS (via Spiget API)
  # ============================================
  # For SpigotMC plugins, 'source', 'version', and either 'resource_id' or 'resource_name' are required.
  # 'resource_id' is the numeric resource ID from spigotmc.org (e.g., 12345).
  # 'resource_name' is the resource name for search-based lookup.
  # Note: Spiget API doesn't provide checksums, so hash verification is skipped.
  
  # Example: EssentialsX (SpigotMC - by resource_id)
  "EssentialsX-Spigot":
    source: "spigotmc"
    version: "2.20.1"
    resource_id: 9089
    # min_version: "2.0.0"    # Optional: override global min
    # max_version: "2.99.99"  # Optional: override global max

  # Example: Vault (SpigotMC - by resource_name)
  "Vault-Spigot":
    source: "spigotmc"
    version: "1.7.3"
    resource_name: "Vault"

  # ============================================
  # LOCAL FILE SOURCE PLUGINS
  # ============================================
  # For local file source, 'source', 'version', and 'path' are required.
  # 'path' can be a directory (scanned for .jar files) or a direct file path.
  # Supports local paths, SMB/CIFS shares, NFS mounts.
  # Optional 'pattern' (regex) to extract version from filename.
  # Optional 'checksum' (SHA-256) or .sha256/.sha512 sidecar files for verification.
  
  # Example: Custom plugin from local directory
  "MyCustomPlugin-Local":
    source: "local"
    version: "1.0.0"
    path: "/opt/minecraft/plugins/update-source/MyCustomPlugin"
    # pattern: "MyCustomPlugin-(\\d+\\.\\d+\\.\\d+)\\.jar"  # Optional: extract version from filename
    # checksum: "a1b2c3d4e5f6..."  # Optional: explicit SHA-256

  # Example: Plugin from network share (SMB/CIFS)
  "SharedPlugin-Local":
    source: "local"
    version: "2.1.0"
    path: "/mnt/plugins-share/SharedPlugin"
    # pattern: "SharedPlugin_v(\\d+\\.\\d+\\.\\d+)\\.jar"

  # ============================================
  # CUSTOM HTTP SOURCE PLUGINS
  # ============================================
  # For custom HTTP source, 'source', 'version', and 'url' are required.
  # 'url' is the REST API endpoint returning JSON.
  # Optional JSONPath expressions for extracting data:
  #   - version_path: path to version string (default: tries common fields)
  #   - download_url_path: path to download URL (default: tries common fields)
  #   - checksum_path: path to SHA-256 checksum (default: tries common fields)
  # Optional 'headers' map for custom headers.
  # Optional 'auth' object for authentication (bearer, basic, api_key).
  # Optional 'checksum' for explicit expected SHA-256.
  
  # Example: Custom REST API with JSONPath
  "MyPlugin-Custom":
    source: "custom"
    version: "1.0.0"
    url: "https://api.example.com/plugins/myplugin/latest"
    version_path: "\$.version"
    download_url_path: "\$.download_url"
    checksum_path: "\$.sha256"
    headers:
      X-Custom-Header: "my-value"
    auth:
      type: "bearer"
      token: "your-api-token-here"
    # checksum: "a1b2c3d4e5f6..."  # Optional: override checksum from API

  # Example: Custom API with Basic Auth
  "AnotherPlugin-Custom":
    source: "custom"
    version: "2.0.0"
    url: "https://internal-api.example.com/v1/plugins/anotherplugin"
    version_path: "\$.latest_version"
    download_url_path: "\$.assets[0].url"
    checksum_path: "\$.assets[0].checksum"
    auth:
      type: "basic"
      username: "updater"
      password: "secret-password"

  # ============================================
  # ADD YOUR PLUGINS BELOW
  # ============================================

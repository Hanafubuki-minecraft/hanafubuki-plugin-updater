# Hanafubuki Plugin Updater - full example
#
# The default config.yml (src/main/resources/config.yml) explains every setting.
# This file shows a filled-in configuration for a real server with every source type.
# It is checked by DefaultConfigTest, so it always matches what the plugin accepts.

global:
  min_version: ""
  max_version: ""
  auto_update_config: true
  auto_discover: true
  auto_discover_on_startup: false
  parallelism: 4
  max_download_mb: 256

modes:
  include_only: false
  exclude_list: ["Geyser-Spigot"]   # updated by hand together with the proxy
  include_list: []

schedule:
  mode: daily
  time: "04:30"
  timezone: "Europe/Moscow"
  check_on_startup: true
  startup_delay_seconds: 120
  check_only: false

backups:
  enabled: true
  keep: 5

dependencies:
  check: block

notifications:
  in_game: true
  on_join: true
  server_name: "Hanafubuki"
  discord:
    enabled: true
    webhook_url: "${DISCORD_WEBHOOK_URL}"
    username: "Hanafubuki Updater"
    mention: "<@&123456789012345678>"
    events: [updated, failed, security]
  webhook:
    enabled: false
    url: "https://monitoring.example.com/hooks/plugin-updates"
    headers:
      Authorization: "Bearer ${UPDATER_WEBHOOK_TOKEN}"
    events: [updated, failed, security, summary]

modrinth:
  loaders: ["paper"]
  version_types: ["release"]
  timeout: 10
  download_timeout: 120
  retry:
    max_retries: 3
    base_delay_ms: 1000
    max_delay_ms: 10000

github:
  token: "${GITHUB_TOKEN}"
  signatures: warn
  include_prereleases: false
  advisories: true

hangar:
  channel: "Release"

spigotmc:
  timeout: 15

custom: {}

console:
  json_format: false

style:
  prefix: "<gradient:#f9a8d4:#c4b5fd>Hanafubuki</gradient> <dark_gray>»</dark_gray> "
  primary: "<#f9a8d4>"
  accent: "<#c4b5fd>"
  success: "<green>"
  warning: "<yellow>"
  error: "<red>"
  muted: "<gray>"

health_check:
  enabled: true
  bind_address: "127.0.0.1"
  port: 8085

plugins:
  # Modrinth: the installed jar is identified by its hash, project_id is optional.
  LuckPerms:
    source: modrinth
  WorldEdit:
    source: modrinth
    project_id: worldedit
    max_version: "7.9.99"   # stay on 7.x

  # Hangar, with GitHub security advisories checked through "repo".
  ViaVersion:
    source: hangar
    project_slug: ViaVersion
    repo: ViaVersion/ViaVersion
  ViaBackwards:
    source: hangar
    project_slug: ViaBackwards
    channel: "*"

  # GitHub releases.
  ProtocolLib:
    source: github
    repo: dmulloy2/ProtocolLib
    asset_pattern: "ProtocolLib.jar"
  Essentials:
    source: github
    repo: EssentialsX/Essentials
    asset_pattern: "EssentialsX-2*.jar"
    signatures: off

  # SpigotMC through Spiget.
  Vault:
    source: spigotmc
    resource_id: 34315

  # A folder on a network share with builds from CI.
  HanafubukiCore:
    source: local
    path: "/mnt/builds/hanafubuki-core"
    pattern: "HanafubukiCore-(.+)\\.jar"

  # Any JSON endpoint.
  InternalTools:
    source: custom
    url: "https://ci.example.com/api/internal-tools/latest"
    version_path: "$.version"
    download_url_path: "$.assets[0].url"
    checksum_path: "$.assets[0].sha256"
    auth:
      type: bearer
      token: "${CI_TOKEN}"
